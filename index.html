<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MTP Platform — Workflow Demo</title>
<style>
  :root{
    --ink:#13233a; --blue:#2f86d6; --blue-dark:#1b4e86; --blue-light:#eaf4fc;
    --bg:#f7f9fb; --border:#e2e8f0; --green:#3fa66b; --amber:#e0a63a; --red:#e05252; --purple:#7c6fe0; --white:#fff;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Roboto,-apple-system,sans-serif;background:var(--bg);color:var(--ink);}
  #topbar{height:60px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:10;}
  #topbar .greet{font-weight:700;font-size:16px;}
  #topbar .right{display:flex;align-items:center;gap:16px;}
  .bell{position:relative;font-size:18px;color:#334;}
  .bell::after{content:"";position:absolute;top:-2px;right:-2px;width:7px;height:7px;background:var(--blue);border-radius:50%;}
  .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#e0a63a,#1b4e86);}
  #body{display:flex;min-height:calc(100vh - 60px);}
  #sidebar{width:64px;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:6px;}
  .navicon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;color:#8a95a5;}
  .navicon.active{background:var(--blue);color:#fff;}
  .navicon.disabled{opacity:.35;cursor:not-allowed;}
  main{flex:1;padding:28px 36px;max-width:1200px;}
  .crumb{color:#8a95a5;font-size:13px;margin-bottom:6px;}
  h1{font-size:22px;margin:0 0 18px 0;}
  h3{margin:0 0 10px 0;}
  .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:18px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  .dashgrid{display:grid;grid-template-columns:2fr 1fr;gap:18px;align-items:start;}
  .promo{border-radius:12px;padding:22px;color:#fff;background:linear-gradient(135deg,var(--blue-dark),var(--blue));cursor:pointer;transition:transform .15s;}
  .promo:hover{transform:translateY(-2px);}
  .promo h3{margin:0 0 8px 0;font-size:17px;color:#fff;}
  .promo p{margin:0 0 14px 0;font-size:13px;opacity:.9;}
  .btn{background:var(--blue);color:#fff;border:none;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;}
  .btn:hover{background:var(--blue-dark);}
  .btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue);}
  .btn.small{padding:6px 12px;font-size:12px;}
  .btn.green{background:var(--green);}
  .btn.amber{background:var(--amber);}
  .btn:disabled{background:#c7d2e0;cursor:not-allowed;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:#5b6b81;font-weight:600;padding:10px 8px;border-bottom:1px solid var(--border);background:var(--blue-light);}
  td{padding:12px 8px;border-bottom:1px solid var(--border);vertical-align:top;}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
  .pill.pending{background:#fdf1de;color:var(--amber);}
  .pill.review{background:#eaf4fc;color:var(--blue);}
  .pill.approved{background:#e6f5ec;color:var(--green);}
  .pill.open{background:#eaf4fc;color:var(--blue);}
  .pill.close{background:#fbe7e7;color:var(--red);}
  .tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .tab{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;color:#5b6b81;}
  .tab.active{background:var(--blue-light);color:var(--blue-dark);}
  .steps{font-size:12px;color:#5b6b81;}
  .stepnote{background:var(--blue-light);border:1px dashed var(--blue);border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--blue-dark);margin-bottom:16px;}
  .jobcard{background:var(--blue-light);border-radius:10px;padding:16px;margin-bottom:14px;}
  .jobcard h4{margin:0 0 6px 0;}
  .jobcard .meta{font-size:12.5px;color:#405066;margin-bottom:10px;}
  .overlay{position:fixed;inset:0;background:rgba(19,35,58,.35);display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal{background:#fff;border-radius:14px;padding:26px;width:420px;max-width:90vw;}
  .modal h3{margin-top:0;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:#405066;}
  .field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
  .backbtn{background:none;border:none;color:var(--blue);font-size:13px;cursor:pointer;font-weight:600;margin-bottom:14px;padding:0;}
  .candrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);}
  .candrow:last-child{border-bottom:none;}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.2);}
  /* dashboard extras */
  .statcard{display:flex;flex-direction:column;gap:6px;}
  .statcard .num{font-size:32px;font-weight:700;}
  .statcard .lbl{color:#5b6b81;font-size:13px;}
  .reqrow{padding:12px 0;border-bottom:1px solid var(--border);font-size:13px;cursor:pointer;}
  .reqrow:last-child{border-bottom:none;}
  .reqrow .meta{color:#8a95a5;font-size:12px;}
  .retstat{display:flex;flex-wrap:wrap;gap:18px;margin-top:12px;}
  .retstat div{min-width:70px;}
  .retstat .n{font-weight:700;font-size:18px;}
  .retstat .l{font-size:12px;color:#5b6b81;}
  .barchart{display:flex;align-items:flex-end;gap:16px;height:150px;margin-top:26px;padding-bottom:20px;position:relative;}
  .barchart .bar{width:26px;background:var(--blue);border-radius:4px 4px 0 0;position:relative;}
  .barchart .bar .lbl{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10.5px;color:#5b6b81;white-space:nowrap;}
  /* pies */
  .piewrap{display:flex;align-items:center;gap:20px;}
  .pie{width:150px;height:150px;border-radius:50%;flex-shrink:0;}
  .legend .item{display:flex;align-items:center;gap:6px;margin-bottom:5px;font-size:12.5px;}
  .swatch{width:10px;height:10px;border-radius:2px;display:inline-block;flex-shrink:0;}
  /* calendar */
  .calnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .calhead{background:var(--blue-light);padding:8px;font-size:12px;font-weight:700;color:#405066;text-align:center;}
  .calcell{background:#fff;min-height:88px;padding:6px;font-size:11.5px;cursor:pointer;}
  .calcell.out{color:#c7d2e0;background:#fbfcfd;}
  .calcell .daynum{font-weight:700;color:#5b6b81;margin-bottom:4px;font-size:12px;}
  .evbar{border-radius:4px;padding:2px 5px;font-size:10px;margin-bottom:3px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* attendance */
  .attheader{background:var(--blue-light);border-radius:10px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .attrow{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:18px;}
  .atttrack{flex:1;height:8px;background:var(--border);border-radius:4px;position:relative;}
  .attfill{position:absolute;left:0;top:0;height:100%;background:var(--blue);border-radius:4px;}
  .attmeta{min-width:150px;font-size:12.5px;}
  .attmeta b{display:block;}
  /* kanban */
  .kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;}
  .kancol{min-width:230px;background:#fff;border-radius:10px;border:1px solid var(--border);flex-shrink:0;}
  .kancol-head{background:var(--blue-dark);color:#fff;padding:10px 14px;border-radius:10px 10px 0 0;font-weight:600;display:flex;justify-content:space-between;font-size:13px;}
  .kancard{background:var(--blue-light);margin:10px;padding:10px;border-radius:8px;font-size:12.5px;}
  .kancard .tags span{display:inline-block;background:#dfeaf7;color:var(--blue-dark);padding:1px 8px;border-radius:10px;font-size:10px;margin-right:4px;margin-bottom:4px;}
  .kancard .name{font-weight:700;margin:4px 0;}
  .kancard .loc{color:#5b6b81;font-size:11.5px;margin-bottom:6px;}
  /* feed */
  .feedwrap{display:flex;gap:20px;align-items:flex-start;}
  .feedmain{flex:1;}
  .groups{width:250px;flex-shrink:0;}
  .grouprow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .groupavatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--green));flex-shrink:0;}
  .postimg{background:linear-gradient(135deg,#eaf4fc,#dfeee5);border-radius:10px;height:160px;display:flex;align-items:center;justify-content:center;font-size:44px;margin:12px 0;}
  .postactions{display:flex;gap:20px;font-size:13px;color:#5b6b81;border-top:1px solid var(--border);padding-top:10px;}
  .postactions span{cursor:pointer;}
  .commentbox{display:flex;gap:8px;margin-top:10px;}
  .commentbox input{flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:12.5px;}
  .commentitem{font-size:12.5px;padding:6px 0;color:#405066;border-top:1px solid var(--border);}
</style>
</head>

function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function setSection(s){ state.section=s; render(); }
function toast(msg){
  const t = el(`<div class="toast">${msg}</div>`);
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2400);
}
function openModal(html){ document.getElementById('modalRoot').innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`; }
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

/* ---------- CALENDAR ---------- */
function buildMonthGrid(year, month){
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay()+6)%7; // Monday=0
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrev = new Date(year, month, 0).getDate();
  const cells = [];
  for(let i=startOffset-1;i>=0;i--) cells.push({d:daysInPrev-i, out:true});
  for(let d=1; d<=daysInMonth; d++) cells.push({d, out:false, date:`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`});
  while(cells.length % 7 !== 0 || cells.length < 35) cells.push({d: cells.length - (startOffset+daysInMonth) + 1, out:true});
  return cells;
}
function renderCalendar(){
  const C = state.calendar;
  const cells = buildMonthGrid(C.year, C.month);
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const dayHeads = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const cellHtml = cells.map(c=>{
    const evs = c.out ? [] : C.events.filter(e=>e.date.startsWith(c.date));
    const evHtml = evs.map(e=>`<div class="evbar" style="background:${e.color};" title="${e.label}">${e.label}</div>`).join('');
    return `<div class="calcell ${c.out?'out':''}" onclick="${c.out?'':`openEventModal('${c.date}')`}">
      <div class="daynum">${c.d}</div>${evHtml}
    </div>`;
  }).join('');
  return `
    <div class="crumb">Home / Calendar</div>
    <button class="backbtn" onclick="setSection('dashboard')">← Back to demo menu</button>
    <h1>Your Calendars</h1>
    <div class="stepnote">Click any day to add a leave/event to it — colors match type (green = approved leave, amber = pending, red/purple = other pending types).</div>
    <div class="card">
      <div class="calnav">
        <h3 style="margin:0;">${monthNames[C.month]} ${C.year}</h3>
        <button class="btn small" onclick="openEventModal()">+ Create Event</button>
      </div>
      <div class="calgrid">
        ${dayHeads.map(d=>`<div class="calhead">${d}</div>`).join('')}
        ${cellHtml}
      </div>
    </div>
  `;
}

function conicGradient(data){
  const total = data.reduce((s,d)=>s+d.v,0) || 1;
  let acc=0; const stops=[];
  data.forEach(d=>{
    const start = acc/total*360; acc+=d.v; const end = acc/total*360;
    stops.push(`${d.c} ${start}deg ${end}deg`);
  });
  return `conic-gradient(${stops.join(',')})`;
}

          <b>Anum Aaaa Edit MTPe</b>
        </div>
        ${p.text ? `<p style="margin:10px 0;">${p.text}</p>` : ''}
        <div class="postimg">🙌</div>
        <div class="postactions">
          <span onclick="likePost(${p.id})">👍 Like (${p.likes})</span>
          <span>💬 Comment (${p.comments.length})</span>
        </div>
        <div class="commentbox">
          <input id="cm_${p.id}" placeholder="Write a comment...">
          <button class="btn small" onclick="addComment(${p.id})">Post</button>
        </div>
        ${comments}
      </div>
    `;
  }).join('');
  const groupsHtml = F.groups.map(g=>`
    <div class="grouprow"><div class="groupavatar"></div><div><b>${g.name}</b><div style="color:#8a95a5;font-size:12px;">${g.members} members</div></div></div>
  `).join('');
  return `
    <div class="crumb">Home / Announcements</div>
    <button class="backbtn" onclick="setSection('dashboard')">← Back to demo menu</button>
    <h1>Announcements</h1>
    <div class="stepnote">Start a post, like it, and add comments. Create a new group on the right.</div>
    <div class="feedwrap">
      <div class="feedmain">
        <div class="card">
          <textarea id="feed_draft" rows="2" placeholder="Start a post...." style="width:100%;border:1px solid var(--border);border-radius:8px;padding:10px;font-family:inherit;"></textarea>
          <div style="display:flex;justify-content:flex-end;margin-top:10px;">
            <button class="btn" onclick="submitPost()">Post</button>
          </div>
        </div>
        ${postsHtml}
      </div>
      <div class="groups">
        <button class="btn" style="width:100%;margin-bottom:16px;" onclick="openGroupModal()">＋ Create Group</button>
        <div class="card">
          <h3>Groups</h3>
          ${groupsHtml}
        </div>
      </div>
    </div>
  `;
}
function submitPost(){
  const text = document.getElementById('feed_draft').value.trim();
  if(!text){ toast('Write something first'); return; }
  state.feed.posts.unshift({id: Date.now(), likes:0, comments:[], text});
  toast('Posted!');
  render();
}
function likePost(id){
  const p = state.feed.posts.find(x=>x.id===id);
  p.likes++;
  render();
}
function addComment(id){
  const input = document.getElementById('cm_'+id);
  const val = input.value.trim();
  if(!val) return;
  const p = state.feed.posts.find(x=>x.id===id);
  p.comments.push(val);
  render();
}
function openGroupModal(){
  openModal(`
    <h3>Create Group</h3>
    <div class="field"><label>Group Name</label><input id="gr_name" value="Product Team"></div>
    <div class="field"><label>Members</label><input id="gr_members" type="number" value="3"></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="submitGroup()">Create</button>
    </div>
  `);
}
function submitGroup(){
  const name = document.getElementById('gr_name').value || 'New Group';
  const members = document.getElementById('gr_members').value || 0;
  state.feed.groups.unshift({name, members});
  closeModal();
  toast('Group created');
  render();
}

/* ---------- EMPLOYEES ---------- */
function renderEmployees(){
  const E = state.employees;
  const q = E.query.toLowerCase();

  const rows = filtered.map((e,i)=>`
    <tr>
      <td>${e.name}</td><td>${e.title||'—'}</td><td>${e.role}</td><td>${e.dept||'—'}</td>
      <td>${e.mobile||'—'}</td><td>${e.email}</td>
      <td><button class="btn small" onclick="viewEmployee(${filtered.indexOf(e)})">View</button></td>
    </tr>`).join('') || `<tr><td colspan="7" style="color:#8a95a5;text-align:center;padding:20px;">No employees match "${E.query}".</td></tr>`;
  return `
    <div class="crumb">Home / Employees</div>
    <button class="backbtn" onclick="setSection('dashboard')">← Back to demo menu</button>
    <h1>Employees</h1>
    <div class="stepnote">Step 1: search by name. Step 2: click <b>+ Add Employee</b> to create a new record. Step 3: click <b>View</b> on any row.</div>
    <div class="card">
      <div style="display:flex;gap:12px;margin-bottom:16px;">
        <input placeholder="Search Employees by First or Last Name…" style="flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;"

        <button class="btn" onclick="openEmployeeModal()">+ Add Employee</button>
      </div>
      <table>
        <tr><th>Name</th><th>Job Title</th><th>User Role</th><th>Department</th><th>Mobile</th><th>Email</th><th>Action</th></tr>
        ${rows}

}
function filterEmployees(v){ state.employees.query = v; render(); }
function viewEmployee(idx){
  const e = state.employees.list[idx];

}
function openEmployeeModal(){
  openModal(`
    <h3>Add Employee</h3>
    <div class="field"><label>Full Name</label><input id="em_name" value="New Employee"></div>
    <div class="field"><label>Job Title</label><input id="em_title" value="Associate"></div>
    <div class="field"><label>User Role</label>
      <select id="em_role"><option>Employee</option><option>Employee Manager</option><option>HR Administrator</option><option>HR Manager</option><option>C-Level</option></select>
    </div>
    <div class="field"><label>Department</label><input id="em_dept" value="Cool"></div>
    <div class="field"><label>Email</label><input id="em_email" value="new.employee@mtp.tech"></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="submitEmployee()">Save</button>
    </div>
  `);
}
function submitEmployee(){
  state.employees.list.unshift({
    name: document.getElementById('em_name').value || 'New Employee',
    title: document.getElementById('em_title').value,
    role: document.getElementById('em_role').value,
    dept: document.getElementById('em_dept').value,
    mobile:'', email: document.getElementById('em_email').value
  });
  closeModal();
  toast('Employee added');
  render();
}

/* ---------- SURVEY MANAGEMENT ---------- */
function renderSurvey(){
  const S = state.survey;
  if(S.viewingId) return renderSurveyAnalytics(S.viewingId);

  const tabMap = {active:'Active', draft:'Draft', closed:'Closed'};
  const activeKey = S.activeTab;
  const filtered = S.surveys.filter(s=>s.status.toLowerCase()===activeKey);
  const rows = filtered.map(s=>{
    const pct = s.total ? Math.round(s.responses/s.total*100) : 0;
    let statusBtn;
    if(s.status==='Draft') statusBtn = `<button class="btn small" onclick="publishSurvey(${s.id})">Publish</button>`;
    else if(s.status==='Active') statusBtn = `<button class="btn small amber" onclick="closeSurvey(${s.id})">Close Survey</button>`;
    else statusBtn = `<span class="pill approved">Closed</span>`;
    const hasResponses = s.responses > 0;
    return `
      <div class="jobcard">
        <div style="display:flex;justify-content:space-between;">
          <h4>${s.title}</h4>
          <span class="pill ${s.status==='Active'?'open':s.status==='Draft'?'pending':'approved'}">${s.status}</span>
        </div>
        <div class="meta">Created: ${s.created}</div>
        ${s.total ? `
          <div class="atttrack" style="margin:10px 0;"><div class="attfill" style="width:${pct}%;"></div></div>
          <div class="meta">${s.responses} of ${s.total} responses (${pct}%)</div>
        ` : `<div class="meta">Not yet published.</div>`}
        <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
          ${statusBtn}
          <button class="btn small ghost" onclick="openEditSurveyModal(${s.id})">✎ Edit</button>
          <button class="btn small ghost" ${hasResponses?'':'disabled'} onclick="${hasResponses?`viewAnalytics(${s.id})`:''}">📊 View Analytics</button>
        </div>
      </div>
    `;
  }).join('') || `<div style="color:#8a95a5;padding:20px;text-align:center;">No ${tabMap[activeKey]} surveys.</div>`;

  return `
    <div class="crumb">Home / Survey Management</div>
    <button class="backbtn" onclick="setSection('dashboard')">← Back to demo menu</button>
    <h1>Survey Management</h1>
    <div class="stepnote">Step 1: click <b>+ Create Survey</b> — it starts as a Draft. Step 2: publish it, or click <b>✎ Edit</b> to change it first. Step 3: once it has responses, click <b>📊 View Analytics</b>.</div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <div class="tabs" style="margin:0;">
          ${Object.keys(tabMap).map(k=>`<div class="tab ${activeKey===k?'active':''}" onclick="setSurveyTab('${k}')">${tabMap[k]}</div>`).join('')}
        </div>
        <button class="btn" onclick="openSurveyModal()">+ Create Survey</button>
      </div>
      ${rows}
    </div>
  `;
}
function openEditSurveyModal(id){
  const s = state.survey.surveys.find(x=>x.id===id);
  openModal(`
    <h3>Edit Survey</h3>
    <div class="field"><label>Survey Title</label><input id="sv_edit_title" value="${s.title}"></div>
    <div class="field"><label>Target Audience Size</label><input id="sv_edit_total" type="number" value="${s.total}"></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="submitEditSurvey(${id})">Save Changes</button>
    </div>
  `);
}
function submitEditSurvey(id){
  const s = state.survey.surveys.find(x=>x.id===id);
  s.title = document.getElementById('sv_edit_title').value || s.title;
  s.total = parseInt(document.getElementById('sv_edit_total').value) || s.total;
  closeModal();
  toast('Survey updated');
  render();
}
function viewAnalytics(id){ state.survey.viewingId = id; render(); }
function surveyBack(){ state.survey.viewingId = null; render(); }
function renderSurveyAnalytics(id){
  const s = state.survey.surveys.find(x=>x.id===id);
  const qBlocks = (s.questions||[]).map((q,qi)=>{
    const maxCount = Math.max(...q.options.map(o=>o.count)) || 1;
    const totalAnswered = q.options.reduce((sum,o)=>sum+o.count,0);
    const bars = q.options.map(o=>{
      const pct = Math.round(o.count/totalAnswered*100);
      const width = Math.round(o.count/maxCount*100);
      return `
        <div style="margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;">
            <span>${o.label}</span><span style="color:#5b6b81;">${o.count} responses (${pct}%)</span>
          </div>
          <div class="atttrack"><div class="attfill" style="width:${width}%;background:${PIE_COLORS[qi % PIE_COLORS.length]};"></div></div>
        </div>`;
    }).join('');
    return `
      <div class="card">
        <h3>Q${qi+1}. ${q.text}</h3>
        <div class="meta" style="color:#8a95a5;font-size:12.5px;margin-bottom:12px;">${totalAnswered} people answered this question</div>
        ${bars}
      </div>`;
  }).join('') || `<div class="card"><p style="color:#8a95a5;">No question data available for this survey yet.</p></div>`;

  return `
    <div class="crumb">Home / Survey Management / ${s.title}</div>
    <button class="backbtn" onclick="surveyBack()">← Back to Survey Management</button>
    <h1>Analytics — ${s.title}</h1>
    <div class="stepnote">Each bar shows how many of the ${s.responses} respondents chose that option, question by question.</div>
    <div class="grid2" style="align-items:start;">
      <div class="card" style="grid-column:1 / -1;">
        <div class="retstat">
          <div><div class="n">${s.responses}</div><div class="l">Total Respondents</div></div>
          <div><div class="n">${s.total}</div><div class="l">Audience Size</div></div>
          <div><div class="n">${s.total ? Math.round(s.responses/s.total*100) : 0}%</div><div class="l">Response Rate</div></div>
          <div><div class="n">${(s.questions||[]).length}</div><div class="l">Questions</div></div>
        </div>
      </div>
    </div>
    ${qBlocks}
  `;
}
function setSurveyTab(k){ state.survey.activeTab=k; render(); }
function openSurveyModal(){
  openModal(`
    <h3>Create Survey</h3>
    <div class="field"><label>Survey Title</label><input id="sv_title" value="New Pulse Survey"></div>
    <div class="field"><label>Target Audience Size</label><input id="sv_total" type="number" value="50"></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="submitSurvey()">Save as Draft</button>
    </div>
  `);
}
function submitSurvey(){
  state.survey.surveys.unshift({
    id: state.survey.nextId++,
    title: document.getElementById('sv_title').value || 'New Survey',
    status:'Draft', responses:0,
    total: parseInt(document.getElementById('sv_total').value)||0,
    created:'—', questions:[]
  });
  state.survey.activeTab='draft';
  closeModal();
  toast('Survey saved as Draft');
  render();
}
function publishSurvey(id){
  const s = state.survey.surveys.find(x=>x.id===id);
  s.status='Active'; s.created='Jul 23, 2026';
  s.responses = Math.floor(s.total*0.15);
  state.survey.activeTab='active';
  toast('Survey published and now Active');
  render();
}
function closeSurvey(id){
  const s = state.survey.surveys.find(x=>x.id===id);
  s.status='Closed';
  s.responses = Math.max(s.responses, Math.floor(s.total*0.8));
  state.survey.activeTab='closed';
  toast('Survey closed');
  render();
}

/* ---------- MASTER RENDER ---------- */
function render(){
  renderSidebar();
  const c = document.getElementById('content');
  if(state.section==='dashboard') c.innerHTML = renderDashboard();
  else if(state.section==='requests') c.innerHTML = renderRequests();
  else if(state.section==='recruit') c.innerHTML = renderRecruit();
  else if(state.section==='pipeline') c.innerHTML = renderPipeline();
  else if(state.section==='insurance') c.innerHTML = renderInsurance();
  else if(state.section==='calendar') c.innerHTML = renderCalendar();
  else if(state.section==='reports') c.innerHTML = renderReports();
  else if(state.section==='attendance') c.innerHTML = renderAttendance();
  else if(state.section==='feed') c.innerHTML = renderFeed();
  else if(state.section==='employees') c.innerHTML = renderEmployees();
  else if(state.section==='settings') c.innerHTML = renderSettings();
  else if(state.section==='survey') c.innerHTML = renderSurvey();
}
render();
</script>
