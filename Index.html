<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTP Platform — Workflow Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lexend:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#151a2e; --ink-soft:#5b6478; --muted:#8990a3;
    --primary:#4f46e5; --primary-dark:#3f37c9; --primary-light:#eef0fd; --primary-mid:#c7c4f7;
    --accent:#0ea5a0;
    --bg:#f4f5fb; --surface:#ffffff; --border:#e7e8f2; --border-soft:#f0f1f8;
    --green:#16a366; --green-light:#e5f7ee; --amber:#dd9a1c; --amber-light:#fdf3df;
    --red:#e0455c; --red-light:#fcebee; --blue:#3a7fe0; --blue-light:#eaf1fd; --purple:#8b5cf6;
    --shadow-sm:0 1px 2px rgba(21,26,46,.05), 0 1px 1px rgba(21,26,46,.04);
    --shadow-md:0 4px 14px rgba(21,26,46,.08), 0 1px 3px rgba(21,26,46,.06);
    --shadow-lg:0 16px 40px rgba(21,26,46,.14), 0 4px 12px rgba(21,26,46,.08);
    --radius:14px; --radius-sm:9px; --sidebar-w:236px;
  }
  *{box-sizing:border-box;}
  html{scrollbar-width:thin;scrollbar-color:#c7c9dd transparent;}
  body{margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  ::selection{background:var(--primary-mid);}
  main::-webkit-scrollbar,#sidebar::-webkit-scrollbar{width:6px;}
  main::-webkit-scrollbar-thumb{background:#d7d9ea;border-radius:6px;}

  /* ---- topbar ---- */
  #topbar{height:66px;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:30;}
  #topbar .left{display:flex;align-items:center;gap:18px;}
  #topbar .greet{font-weight:700;font-size:15.5px;letter-spacing:-.01em;}
  #topbar .greet span{color:var(--ink-soft);font-weight:500;font-size:12.5px;display:block;margin-top:1px;}
  .searchbox{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:8px 14px;width:270px;color:var(--muted);transition:border-color .15s,box-shadow .15s;}
  .searchbox:focus-within{border-color:var(--primary-mid);box-shadow:0 0 0 3px var(--primary-light);}
  .searchbox svg{flex-shrink:0;}
  .searchbox input{border:none;background:none;outline:none;font-size:13px;font-family:inherit;width:100%;color:var(--ink);}
  #topbar .right{display:flex;align-items:center;gap:18px;}
  .iconbtn{position:relative;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);cursor:pointer;transition:background .15s;}
  .iconbtn:hover{background:var(--bg);}
  .iconbtn .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;background:var(--red);border:2px solid #fff;border-radius:50%;}
  .userchip{display:flex;align-items:center;gap:10px;padding:4px 6px 4px 4px;border-radius:12px;cursor:pointer;transition:background .15s;}
  .userchip:hover{background:var(--bg);}
  .avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--amber),var(--primary));flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;box-shadow:var(--shadow-sm);}
  .userchip .who{font-size:12.5px;line-height:1.35;}
  .userchip .who b{display:block;font-size:13px;}
  .userchip .who span{color:var(--muted);font-size:11.5px;}

  /* ---- layout ---- */
  #body{display:flex;min-height:calc(100vh - 66px);}
  #sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 14px;gap:2px;position:sticky;top:66px;height:calc(100vh - 66px);overflow-y:auto;flex-shrink:0;}
  .brand{display:flex;align-items:center;gap:10px;padding:2px 8px 20px 8px;}
  .brand .mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;font-family:'Lexend',sans-serif;flex-shrink:0;}
  .brand .name{font-family:'Lexend',sans-serif;font-weight:700;font-size:15px;letter-spacing:-.01em;}
  .navsec{font-size:10.5px;font-weight:700;letter-spacing:.07em;color:var(--muted);text-transform:uppercase;margin:14px 8px 6px 8px;}
  .navsec:first-of-type{margin-top:2px;}
  .navicon{position:relative;display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink-soft);transition:background .15s,color .15s;}
  .navicon svg{flex-shrink:0;opacity:.85;}
  .navicon:hover{background:var(--bg);color:var(--ink);}
  .navicon.active{background:var(--primary-light);color:var(--primary-dark);}
  .navicon.active svg{opacity:1;}
  .navicon.active::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--primary);}
  .navicon.disabled{opacity:.4;cursor:not-allowed;}

  main{flex:1;padding:30px 38px 60px;max-width:1240px;animation:fadeUp .28s ease;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .crumb{color:var(--muted);font-size:12.5px;margin-bottom:8px;font-weight:500;}
  h1{font-family:'Lexend',sans-serif;font-size:23px;font-weight:700;letter-spacing:-.015em;margin:0 0 20px 0;}
  h3{margin:0 0 12px 0;font-size:14.5px;font-weight:700;letter-spacing:-.005em;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:20px;box-shadow:var(--shadow-sm);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  .dashgrid{display:grid;grid-template-columns:2fr 1fr;gap:20px;align-items:start;}

  .promo{position:relative;overflow:hidden;border-radius:var(--radius);padding:24px;color:#fff;background:linear-gradient(135deg,var(--primary-dark),var(--primary));cursor:pointer;transition:transform .18s ease,box-shadow .18s ease;box-shadow:var(--shadow-md);}
  .promo::after{content:"";position:absolute;top:-30px;right:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);}
  .promo:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);}
  .promo .picn{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
  .promo h3{margin:0 0 6px 0;font-size:16.5px;color:#fff;font-family:'Lexend',sans-serif;}
  .promo p{margin:0 0 16px 0;font-size:13px;opacity:.88;line-height:1.5;}

  .btn{background:var(--primary);color:#fff;border:none;padding:10px 18px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:7px;transition:background .15s,transform .1s,box-shadow .15s;box-shadow:0 1px 2px rgba(79,70,229,.25);}
  .btn:hover{background:var(--primary-dark);}
  .btn:active{transform:translateY(1px);}
  .btn.ghost{background:var(--surface);color:var(--primary);border:1px solid var(--border);box-shadow:none;}
  .btn.ghost:hover{background:var(--primary-light);border-color:var(--primary-mid);}
  .btn.small{padding:7px 13px;font-size:12px;}
  .btn.green{background:var(--green);box-shadow:0 1px 2px rgba(22,163,102,.25);}
  .btn.green:hover{background:#128052;}
  .btn.amber{background:var(--amber);box-shadow:0 1px 2px rgba(221,154,28,.25);}
  .btn.amber:hover{background:#c1850f;}
  .btn:disabled{background:#e2e4ef;color:#a9adc2;cursor:not-allowed;box-shadow:none;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--ink-soft);font-weight:700;font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;padding:11px 10px;border-bottom:1px solid var(--border);background:var(--bg);}
  th:first-child{border-radius:8px 0 0 8px;}
  th:last-child{border-radius:0 8px 8px 0;}
  td{padding:13px 10px;border-bottom:1px solid var(--border-soft);vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover td, table tr:hover td{background:var(--bg);}

  .pill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.01em;}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
  .pill.pending{background:var(--amber-light);color:var(--amber);}
  .pill.review{background:var(--blue-light);color:var(--blue);}
  .pill.approved{background:var(--green-light);color:var(--green);}
  .pill.open{background:var(--blue-light);color:var(--blue);}
  .pill.close{background:var(--red-light);color:var(--red);}

  .tabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap;background:var(--bg);padding:4px;border-radius:11px;width:fit-content;}
  .tab{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-soft);transition:background .15s,color .15s;}
  .tab:hover{color:var(--ink);}
  .tab.active{background:var(--surface);color:var(--primary-dark);box-shadow:var(--shadow-sm);}

  .steps{font-size:12px;color:var(--ink-soft);}
  .stepnote{background:var(--primary-light);border:1px solid var(--primary-mid);border-radius:var(--radius-sm);padding:12px 16px;font-size:12.5px;color:var(--primary-dark);margin-bottom:18px;display:flex;gap:10px;align-items:flex-start;line-height:1.5;}
  .stepnote svg{flex-shrink:0;margin-top:1px;}

  .jobcard{background:var(--bg);border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:18px;margin-bottom:14px;transition:box-shadow .15s;}
  .jobcard:hover{box-shadow:var(--shadow-sm);}
  .jobcard h4{margin:0 0 6px 0;font-size:14px;}
  .jobcard .meta{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;line-height:1.5;}

  .overlay{position:fixed;inset:0;background:rgba(21,26,46,.45);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:50;animation:fadeIn .15s ease;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .modal{background:#fff;border-radius:18px;padding:28px;width:440px;max-width:90vw;box-shadow:var(--shadow-lg);animation:modalPop .18s cubic-bezier(.2,.9,.3,1.2);max-height:88vh;overflow-y:auto;}
  @keyframes modalPop{from{opacity:0;transform:scale(.96) translateY(6px);}to{opacity:1;transform:scale(1) translateY(0);}}
  .modal h3{margin-top:0;font-size:17px;}
  .field{margin-bottom:15px;}
  .field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;}
  .field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:9px;font-size:13.5px;font-family:inherit;background:var(--bg);transition:border-color .15s,box-shadow .15s,background .15s;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px var(--primary-light);}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
  .backbtn{background:none;border:none;color:var(--ink-soft);font-size:13px;cursor:pointer;font-weight:600;margin-bottom:16px;padding:0;display:inline-flex;align-items:center;gap:6px;transition:color .15s;}
  .backbtn:hover{color:var(--primary);}
  .candrow{display:flex;justify-content:space-between;align-items:center;padding:13px 4px;border-bottom:1px solid var(--border-soft);}
  .candrow:last-child{border-bottom:none;}
  .toast{position:fixed;bottom:26px;right:26px;background:var(--ink);color:#fff;padding:13px 20px;border-radius:12px;font-size:13px;font-weight:500;z-index:60;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;animation:toastIn .25s cubic-bezier(.2,.9,.3,1.2);}
  @keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
  .toast::before{content:"✓";display:flex;align-items:center;justify-content:center;width:18px;height:18px;background:var(--green);border-radius:50%;font-size:11px;flex-shrink:0;}

  /* dashboard extras */
  .statcard{display:flex;flex-direction:column;gap:10px;}
  .statcard .icn{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;}
  .statcard .num{font-size:30px;font-weight:800;font-family:'Lexend',sans-serif;letter-spacing:-.02em;}
  .statcard .lbl{color:var(--ink-soft);font-size:12.5px;font-weight:600;}
  .reqrow{padding:13px 4px;border-bottom:1px solid var(--border-soft);font-size:13px;cursor:pointer;border-radius:8px;transition:background .15s;}
  .reqrow:hover{background:var(--bg);}
  .reqrow:last-child{border-bottom:none;}
  .reqrow .meta{color:var(--muted);font-size:12px;margin-top:2px;}
  .retstat{display:flex;flex-wrap:wrap;gap:20px;margin-top:14px;}
  .retstat div{min-width:70px;}
  .retstat .n{font-weight:800;font-size:19px;font-family:'Lexend',sans-serif;}
  .retstat .l{font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-top:2px;}
  .barchart{display:flex;align-items:flex-end;gap:16px;height:150px;margin-top:28px;padding-bottom:22px;position:relative;}
  .barchart .bar{width:26px;background:linear-gradient(180deg,var(--primary),var(--primary-dark));border-radius:6px 6px 2px 2px;position:relative;}
  .barchart .bar .lbl{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--ink-soft);white-space:nowrap;font-weight:500;}

  /* pies */
  .piewrap{display:flex;align-items:center;gap:22px;}
  .pie{width:150px;height:150px;border-radius:50%;flex-shrink:0;box-shadow:inset 0 0 0 30px #fff,0 0 0 1px var(--border-soft);}
  .legend .item{display:flex;align-items:center;gap:7px;margin-bottom:6px;font-size:12.5px;font-weight:500;}
  .swatch{width:9px;height:9px;border-radius:3px;display:inline-block;flex-shrink:0;}

  /* calendar */
  .calnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .calhead{background:var(--bg);padding:9px;font-size:11.5px;font-weight:700;color:var(--ink-soft);text-align:center;text-transform:uppercase;letter-spacing:.03em;}
  .calcell{background:#fff;min-height:90px;padding:7px;font-size:11.5px;cursor:pointer;transition:background .15s;}
  .calcell:hover{background:var(--primary-light);}
  .calcell.out{color:#c7c9dd;background:#fbfbfd;}
  .calcell .daynum{font-weight:700;color:var(--ink-soft);margin-bottom:4px;font-size:12px;}
  .evbar{border-radius:5px;padding:2px 6px;font-size:10px;margin-bottom:3px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;}

  /* attendance */
  .attheader{background:var(--primary-light);border-radius:var(--radius-sm);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .attrow{border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:15px 18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:18px;transition:box-shadow .15s;}
  .attrow:hover{box-shadow:var(--shadow-sm);}
  .atttrack{flex:1;height:8px;background:var(--border);border-radius:4px;position:relative;}
  .attfill{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:4px;}
  .attmeta{min-width:150px;font-size:12.5px;}
  .attmeta b{display:block;margin-bottom:2px;}

  /* kanban */
  .kanban{display:flex;gap:16px;overflow-x:auto;padding-bottom:10px;}
  .kancol{min-width:250px;background:var(--bg);border-radius:var(--radius-sm);border:1px solid var(--border-soft);flex-shrink:0;}
  .kancol-head{background:var(--surface);color:var(--ink);border-bottom:2px solid var(--primary);padding:12px 15px;border-radius:var(--radius-sm) var(--radius-sm) 0 0;font-weight:700;display:flex;justify-content:space-between;font-size:13px;}
  .kancol-head span:last-child{background:var(--primary-light);color:var(--primary-dark);border-radius:20px;padding:1px 9px;font-size:11.5px;}
  .kancard{background:#fff;margin:11px;padding:13px;border-radius:10px;font-size:12.5px;box-shadow:var(--shadow-sm);border:1px solid var(--border-soft);transition:box-shadow .15s,transform .15s;}
  .kancard:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
  .kancard .tags span{display:inline-block;background:var(--primary-light);color:var(--primary-dark);padding:2px 9px;border-radius:10px;font-size:10px;font-weight:600;margin-right:4px;margin-bottom:4px;}
  .kancard .name{font-weight:700;margin:5px 0;font-size:13.5px;}
  .kancard .loc{color:var(--ink-soft);font-size:11.5px;margin-bottom:6px;}

  /* feed */
  .feedwrap{display:flex;gap:22px;align-items:flex-start;}
  .feedmain{flex:1;}
  .groups{width:260px;flex-shrink:0;}
  .grouprow{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px solid var(--border-soft);font-size:13px;font-weight:500;}
  .groupavatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));flex-shrink:0;}
  .postimg{background:linear-gradient(135deg,var(--primary-light),#e3f7f2);border-radius:var(--radius-sm);height:170px;display:flex;align-items:center;justify-content:center;font-size:46px;margin:14px 0;}
  .postactions{display:flex;gap:22px;font-size:13px;color:var(--ink-soft);border-top:1px solid var(--border-soft);padding-top:12px;font-weight:500;}
  .postactions span{cursor:pointer;transition:color .15s;}
  .postactions span:hover{color:var(--primary);}
  .commentbox{display:flex;gap:9px;margin-top:12px;}
  .commentbox input{flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:9px;font-size:12.5px;font-family:inherit;background:var(--bg);}
  .commentitem{font-size:12.5px;padding:8px 2px;color:var(--ink-soft);border-top:1px solid var(--border-soft);}
</style>
</head>
<body>
<div id="topbar">
  <div class="left">
    <div class="greet">Welcome back, Anum<span>MTP Platform · Workforce Suite</span></div>
    <div class="searchbox">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input placeholder="Search people, requests, records…">
    </div>
  </div>
  <div class="right">
    <div class="iconbtn" title="Notifications" onclick="toast('You are all caught up')">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="dot"></span>
    </div>
    <div class="userchip">
      <div class="avatar">AA</div>
      <div class="who"><b>Anum</b><span>Portfolio &amp; Delivery Lead</span></div>
    </div>
  </div>
</div>
<div id="body">
  <div id="sidebar"></div>
  <main id="content"></main>
</div>
<div id="modalRoot"></div>

<script>
const PIE_COLORS = ['#4f46e5','#3a7fe0','#0ea5a0','#16a366','#8b5cf6','#dd9a1c','#c9d6e3'];
const ICONS = {
  dashboard:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',

function setSection(s){ state.section=s; render(); }
function toast(msg){
  const t = el(`<div class="toast">${msg}</div>`);
  document.body.appendChild(t);

}

/* ---------- LEAVE / REQUESTS WORKFLOW ---------- */
function renderRequests(){
  const L = state.leave;
  const rows = L.rows.map(r=>{
    let stepLabel, actionBtn;
    if(r.stage==='manager'){
      stepLabel = `<span class="pill pending">Awaiting Manager Approval</span>`;
      actionBtn = `<button class="btn small" onclick="leaveAdvance(${r.id})">Approve (Manager)</button>`;
    } else if(r.stage==='hr'){
      stepLabel = `<span class="pill review">Awaiting HR Approval</span>`;
      actionBtn = `<button class="btn small green" onclick="leaveAdvance(${r.id})">Approve (HR)</button>`;
    } else {
      stepLabel = `<span class="pill approved">Approved</span>`;
      actionBtn = `—`;
    }
    return `<tr>
      <td>Leave: ${r.type}</td>
      <td>${r.from} → ${r.to}</td>
      <td>${r.purpose}</td>
      <td>Manager Approval &gt; HR Approval</td>
      <td>${stepLabel}</td>
      <td>${actionBtn}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="6" style="color:#8a95a5;text-align:center;padding:24px;">No requests yet — submit one below.</td></tr>`;

  return `
    <div class="crumb">Home / Requests</div>
    <button class="backbtn" onclick="setSection('dashboard')">← Back to demo menu</button>
    <h1>Submit a new request</h1>
    <div class="stepnote">${ICONS.info}Step 1: click <b>Request Leave</b> to open the form. Step 2: submit it. Step 3: click through Manager → HR approval on the row that appears below.</div>
    <div class="card">
      <div style="display:flex;gap:10px;margin-bottom:18px;">
        <button class="btn" onclick="openLeaveModal()">Request Leave</button>
        <button class="btn ghost" disabled>Request Document</button>
        <button class="btn ghost" disabled>Request Expense</button>
        <button class="btn ghost" disabled>Shift Swapping Request</button>
      </div>
      <h3>Outgoing Requests</h3>
      <table>
        <tr><th>Process</th><th>Dates</th><th>Purpose</th><th>Steps to Success</th><th>Status</th><th>Action</th></tr>
        ${rows}
      </table>
    </div>
  `;
}
function openLeaveModal(){
  openModal(`
    <h3>Request Leave</h3>
    <div class="field"><label>Leave Type</label>
      <select id="lf_type"><option>Sick</option><option>Unpaid</option><option>Maternity</option><option>Paternity</option><option>Work from home</option></select>
    </div>
    <div class="field"><label>From</label><input type="date" id="lf_from" value="2026-08-03"></div>
    <div class="field"><label>To</label><input type="date" id="lf_to" value="2026-08-04"></div>
    <div class="field"><label>Purpose</label><textarea id="lf_purpose" rows="2">Family event</textarea></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="submitLeave()">Submit Request</button>
    </div>
  `);
}
function submitLeave(){
  const type = document.getElementById('lf_type').value;
  const from = document.getElementById('lf_from').value;
  const to = document.getElementById('lf_to').value;
  const purpose = document.getElementById('lf_purpose').value || '—';
  state.leave.rows.push({ id: state.leave.nextId++, type, from, to, purpose, stage:'manager' });
  closeModal();
  toast('Leave request submitted — now awaiting Manager Approval');
  render();
}
function leaveAdvance(id){
  const r = state.leave.rows.find(x=>x.id===id);
  if(r.stage==='manager'){ r.stage='hr'; toast('Manager approved — now awaiting HR Approval'); }
  else if(r.stage==='hr'){ r.stage='approved'; toast('HR approved — request is now Approved ✅'); }
  render();
}

/* ---------- CALENDAR ---------- */
function buildMonthGrid(year, month){
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay()+6)%7; // Monday=0
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrev = new Date(year, month, 0).getDate();
  const cells = [];
  for(let i=startOffset-1;i>=0;i--) cells.push({d:daysInPrev-i, out:true});
  for(let d=1; d<=daysInMonth; d++) cells.push({d, out:false, date:`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`});
  while(cells.length % 7 !== 0 || cells.length < 35) cells.push({d: cells.length - (startOffset+daysInMonth) + 1, out:true});
  return cells;
}
function renderCalendar(){
  const C = state.calendar;
  const cells = buildMonthGrid(C.year, C.month);
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const dayHeads = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const cellHtml = cells.map(c=>{
    const evs = c.out ? [] : C.events.filter(e=>e.date.startsWith(c.date));
    const evHtml = evs.map(e=>`<div class="evbar" style="background:${e.color};" title="${e.label}">${e.label}</div>`).join('');
    return `<div class="calcell ${c.out?'out':''}" onclick="${c.out?'':`openEventModal('${c.date}')`}">
      <div class="daynum">${c.d}</div>${evHtml}
    </div>`;
  }).join('');
  return `
    <div class="crumb">Home / Calendar</div>
    <button class="backbtn" onclick="setSection('dashboard')">← Back to demo menu</button>
    <h1>Your Calendars</h1>
    <div class="stepnote">${ICONS.info}Click any day to add a leave/event to it — colors match type (green = approved leave, amber = pending, red/purple = other pending types).</div>
    <div class="card">
      <div class="calnav">

        <button class="btn small" onclick="openEventModal()">+ Create Event</button>
      </div>
      <div class="calgrid">
        ${dayHeads.map(d=>`<div class="calhead">${d}</div>`).join('')}

/* ---------- REPORTS ---------- */
function conicGradient(data){
  const total = data.reduce((s,d)=>s+d.v,0) || 1;
  let acc=0; const stops=[];
  data.forEach(d=>{
    const start = acc/total*360; acc+=d.v; const end = acc/total*360;
    stops.push(`${d.c} ${start}deg ${end}deg`);
  });
  return `conic-gradient(${stops.join(',')})`;
}
function renderPieCard(title, data){

    <div class="piewrap">

      <div class="legend">${data.map(d=>`<div class="item"><span class="swatch" style="background:${d.c};"></span>${d.l} (${d.v})</div>`).join('')}</div>
    </div>
  </div>`;
}

}

/* ---------- SURVEY MANAGEMENT ---------- */
function renderSurvey(){
  const S = state.survey;
  if(S.viewingId) return renderSurveyAnalytics(S.viewingId);

  const tabMap = {active:'Active', draft:'Draft', closed:'Closed'};
  const activeKey = S.activeTab;
  const filtered = S.surveys.filter(s=>s.status.toLowerCase()===activeKey);
  const rows = filtered.map(s=>{
    const pct = s.total ? Math.round(s.responses/s.total*100) : 0;
    let statusBtn;
    if(s.status==='Draft') statusBtn = `<button class="btn small" onclick="publishSurvey(${s.id})">Publish</button>`;
    else if(s.status==='Active') statusBtn = `<button class="btn small amber" onclick="closeSurvey(${s.id})">Close Survey</button>`;
    else statusBtn = `<span class="pill approved">Closed</span>`;
    const hasResponses = s.responses > 0;
    return `
      <div class="jobcard">
        <div style="display:flex;justify-content:space-between;">
          <h4>${s.title}</h4>
          <span class="pill ${s.status==='Active'?'open':s.status==='Draft'?'pending':'approved'}">${s.status}</span>
        </div>
        <div class="meta">Created: ${s.created}</div>
        ${s.total ? `
          <div class="atttrack" style="margin:10px 0;"><div class="attfill" style="width:${pct}%;"></div></div>
          <div class="meta">${s.responses} of ${s.total} responses (${pct}%)</div>
        ` : `<div class="meta">Not yet published.</div>`}
        <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
          ${statusBtn}
          <button class="btn small ghost" onclick="openEditSurveyModal(${s.id})">✎ Edit</button>
          <button class="btn small ghost" ${hasResponses?'':'disabled'} onclick="${hasResponses?`viewAnalytics(${s.id})`:''}">📊 View Analytics</button>
        </div>
      </div>
    `;
  }).join('') || `<div style="color:#8a95a5;padding:20px;text-align:center;">No ${tabMap[activeKey]} surveys.</div>`;

  return `
    <div class="crumb">Home / Survey Management</div>
    <button class="backbtn" onclick="setSection('dashboard')">← Back to demo menu</button>
    <h1>Survey Management</h1>
    <div class="stepnote">${ICONS.info}Step 1: click <b>+ Create Survey</b> — it starts as a Draft. Step 2: publish it, or click <b>✎ Edit</b> to change it first. Step 3: once it has responses, click <b>📊 View Analytics</b>.</div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <div class="tabs" style="margin:0;">
          ${Object.keys(tabMap).map(k=>`<div class="tab ${activeKey===k?'active':''}" onclick="setSurveyTab('${k}')">${tabMap[k]}</div>`).join('')}
        </div>
        <button class="btn" onclick="openSurveyModal()">+ Create Survey</button>
      </div>
      ${rows}
    </div>
  `;
}
function openEditSurveyModal(id){
  const s = state.survey.surveys.find(x=>x.id===id);
  openModal(`
    <h3>Edit Survey</h3>
    <div class="field"><label>Survey Title</label><input id="sv_edit_title" value="${s.title}"></div>
    <div class="field"><label>Target Audience Size</label><input id="sv_edit_total" type="number" value="${s.total}"></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="submitEditSurvey(${id})">Save Changes</button>
    </div>
  `);
}
function submitEditSurvey(id){
  const s = state.survey.surveys.find(x=>x.id===id);
  s.title = document.getElementById('sv_edit_title').value || s.title;
  s.total = parseInt(document.getElementById('sv_edit_total').value) || s.total;
  closeModal();
  toast('Survey updated');
  render();
}
function viewAnalytics(id){ state.survey.viewingId = id; render(); }
function surveyBack(){ state.survey.viewingId = null; render(); }
function renderSurveyAnalytics(id){
  const s = state.survey.surveys.find(x=>x.id===id);
  const qBlocks = (s.questions||[]).map((q,qi)=>{
    const maxCount = Math.max(...q.options.map(o=>o.count)) || 1;
    const totalAnswered = q.options.reduce((sum,o)=>sum+o.count,0);
    const bars = q.options.map(o=>{
      const pct = Math.round(o.count/totalAnswered*100);
      const width = Math.round(o.count/maxCount*100);
      return `
        <div style="margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;">
            <span>${o.label}</span><span style="color:#5b6b81;">${o.count} responses (${pct}%)</span>
          </div>
          <div class="atttrack"><div class="attfill" style="width:${width}%;background:${PIE_COLORS[qi % PIE_COLORS.length]};"></div></div>
        </div>`;
    }).join('');
    return `
      <div class="card">
        <h3>Q${qi+1}. ${q.text}</h3>
        <div class="meta" style="color:#8a95a5;font-size:12.5px;margin-bottom:12px;">${totalAnswered} people answered this question</div>
        ${bars}
      </div>`;
  }).join('') || `<div class="card"><p style="color:#8a95a5;">No question data available for this survey yet.</p></div>`;

  return `
    <div class="crumb">Home / Survey Management / ${s.title}</div>
    <button class="backbtn" onclick="surveyBack()">← Back to Survey Management</button>
    <h1>Analytics — ${s.title}</h1>
    <div class="stepnote">${ICONS.info}Each bar shows how many of the ${s.responses} respondents chose that option, question by question.</div>
    <div class="grid2" style="align-items:start;">
      <div class="card" style="grid-column:1 / -1;">
        <div class="retstat">
          <div><div class="n">${s.responses}</div><div class="l">Total Respondents</div></div>
          <div><div class="n">${s.total}</div><div class="l">Audience Size</div></div>
          <div><div class="n">${s.total ? Math.round(s.responses/s.total*100) : 0}%</div><div class="l">Response Rate</div></div>
          <div><div class="n">${(s.questions||[]).length}</div><div class="l">Questions</div></div>
        </div>
      </div>
    </div>
    ${qBlocks}
  `;
}
function setSurveyTab(k){ state.survey.activeTab=k; render(); }
function openSurveyModal(){
  openModal(`
    <h3>Create Survey</h3>
    <div class="field"><label>Survey Title</label><input id="sv_title" value="New Pulse Survey"></div>
    <div class="field"><label>Target Audience Size</label><input id="sv_total" type="number" value="50"></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="submitSurvey()">Save as Draft</button>
    </div>
  `);
}
function submitSurvey(){
  state.survey.surveys.unshift({
    id: state.survey.nextId++,
    title: document.getElementById('sv_title').value || 'New Survey',
    status:'Draft', responses:0,
    total: parseInt(document.getElementById('sv_total').value)||0,
    created:'—', questions:[]
  });
  state.survey.activeTab='draft';
  closeModal();
  toast('Survey saved as Draft');
  render();
}
function publishSurvey(id){
  const s = state.survey.surveys.find(x=>x.id===id);
  s.status='Active'; s.created='Jul 23, 2026';
  s.responses = Math.floor(s.total*0.15);
  state.survey.activeTab='active';
  toast('Survey published and now Active');
  render();
}
function closeSurvey(id){
  const s = state.survey.surveys.find(x=>x.id===id);
  s.status='Closed';
  s.responses = Math.max(s.responses, Math.floor(s.total*0.8));
  state.survey.activeTab='closed';
  toast('Survey closed');
  render();
}

/* ---------- MASTER RENDER ---------- */
function render(){
  renderSidebar();
  const c = document.getElementById('content');
  if(state.section==='dashboard') c.innerHTML = renderDashboard();
  else if(state.section==='requests') c.innerHTML = renderRequests();
  else if(state.section==='recruit') c.innerHTML = renderRecruit();
  else if(state.section==='pipeline') c.innerHTML = renderPipeline();
  else if(state.section==='insurance') c.innerHTML = renderInsurance();
  else if(state.section==='calendar') c.innerHTML = renderCalendar();
  else if(state.section==='reports') c.innerHTML = renderReports();
  else if(state.section==='attendance') c.innerHTML = renderAttendance();
  else if(state.section==='feed') c.innerHTML = renderFeed();
  else if(state.section==='employees') c.innerHTML = renderEmployees();
  else if(state.section==='settings') c.innerHTML = renderSettings();
  else if(state.section==='survey') c.innerHTML = renderSurvey();
}
render();
</script>
